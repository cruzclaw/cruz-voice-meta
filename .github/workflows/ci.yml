name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w @cruzclaw/voice-core
      - run: npm run build -w @cruzclaw/voice-server

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The gate covers every package that ships or is imported by the private repo.
      - run: npm audit --audit-level=high -w @cruzclaw/voice-core -w @cruzclaw/voice-server -w @cruzclaw/windows-bridge -w @cruzclaw/demo-server -w @cruzclaw/mock-employee -w @cruzclaw/windows-voice-host -w @cruzclaw/wake-word
      # Kokoro's dependency tree carries unfixed advisories in sharp (image decoding),
      # which speech synthesis never calls. Reported, not gated. Re-check when sharp is fixed.
      - name: Report advisories in the isolated Kokoro package
        run: npm audit -w @cruzclaw/tts-kokoro || true
      - name: Check dependency licenses
        run: npx --yes license-checker-rseidelsohn@5.0.1 --summary --failOn "GPL-2.0;GPL-3.0;AGPL-3.0"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan full history for secrets
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose
